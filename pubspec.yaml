name: faap_scan
description: Advanced Food Additive & Preservative Scanner Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core dependencies
  cupertino_icons: ^1.0.6
  
  # State management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.0.1
  
  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  
  # Barcode scanning
  mobile_scanner: ^4.0.0
  
  # Local storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Network
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  
  # Data visualization
  fl_chart: ^0.66.0
  
  # Utilities
  intl: ^0.18.1
  permission_handler: ^11.1.0
  flutter_local_notifications: ^16.3.0
  share_plus: ^7.2.1
  
  # Animations
  flutter_animate: ^4.3.0
  
  # Image handling
  image_picker: ^1.0.5
  
  # Device info
  device_info_plus: ^9.1.1
  
  # Analytics
  firebase_core: ^2.24.2
  firebase_analytics: ^10.8.0
  
  # Payments (for premium features)
  in_app_purchase: ^3.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  
flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf